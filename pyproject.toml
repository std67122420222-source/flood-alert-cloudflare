[project]
name = "flood-alert-cloudflare"
version = "2.2.0"
description = "FloodAlert Flask app for Cloudflare Python Workers with Hyperdrive and Supabase PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<4",
    "flask-sqlalchemy>=3.1,<4",
    "flask-login>=0.6,<1",
    "bcrypt==4.3.0",
    "requests>=2.33,<3",
    "python-dotenv>=1.1,<2",
    "pg8000>=1.31,<2",
]

[dependency-groups]
dev = [
    "workers-py==1.17.6",
    "workers-runtime-sdk==1.9.2",
]
