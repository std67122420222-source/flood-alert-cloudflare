[project]
name = "flood-alert-cloudflare"
version = "2.0.0"
description = "FloodAlert Flask application running on Cloudflare Python Workers with Hyperdrive and Supabase PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<4",
    "flask-sqlalchemy>=3.1,<4",
    "flask-login>=0.6,<1",
    "bcrypt>=5,<6",
    "requests>=2.33,<3",
    "python-dotenv>=1.1,<2",
    "pg8000>=1.31,<2",
    "workers-py>=1.9.4,<2",
]

[dependency-groups]
dev = [
    "workers-runtime-sdk",
]
